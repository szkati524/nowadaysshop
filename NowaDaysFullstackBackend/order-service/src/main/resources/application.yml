server:
  port: 8088

spring:
  application:
    name: order-service
  cassandra:
    contact-points: 127.0.0.1
    port: 9042
    keyspace-name: order_keyspace
    local-datacenter: datacenter1
    schema-action: create_if_not_exists
    schema-action-scripts:
      - classpath:schema.cql

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

services:
  catalog:
    url: ${CATALOG_SERVICE_URL:http://CATALOG-SERVICE}
  user:
    url: ${USER_SERVICE_URL:http://USER-SERVICE}

jwt:
  secret: ${JWT_SECRET:tWsUR+YBSTYgBZg4/wkbGHYh4g72VOFIlF76SNWEK0I7rGYKJ/ZPUVB/M/XlMq0d}
  expirationMs: 86400000